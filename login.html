<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cozy Cabin | Вхід</title>
    <link rel="stylesheet" href="kazinak.css">
    <link rel="icon" href="icon1.png" type="image/x-icon">
</head>

<body>
<div class="login-card">
    <div class="snow">❄</div>
    <h2 id="form-title">Увійти в Cabin</h2>
    
    <div class="input-group">
        <input type="text" id="username" placeholder="Нікнейм">
    </div>
    <div class="input-group">
        <input type="password" id="password" placeholder="Пароль">
    </div>

    <button onclick="handleSubmit()" id="main-btn">Зайти</button>
    
    <div class="toggle-text" onclick="toggleMode()" id="toggle-link">
        Створити новий акаунт
    </div>
</div>
<script src="kazinak.js"></script>

<script type="module">
  // Імпортуємо Firebase SDK
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  // Твій конфіг (ЗАМІНИ НА СВІЙ ІЗ КОНСОЛІ FIREBASE)
  const firebaseConfig = {
    apiKey: "AIzaSyCMwHzRqWieYWVTO1Ff8cMgA5a1P-HLz_Q",
    authDomain: "cozycabin-4ee1b.firebaseapp.com",
    databaseURL: "https://cozycabin-4ee1b-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "cozycabin-4ee1b",
    storageBucket: "cozycabin-4ee1b.firebasestorage.app",
    messagingSenderId: "20286167825",
    appId: "1:20286167825:web:751f25f23ae7c3f4330ab0"
  };

  // Ініціалізація
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  // Робимо функції доступними для кнопок
  window.handleSubmit = async function() {
    const user = document.getElementById('username').value;
    const pass = document.getElementById('password').value;
    const isLoginMode = document.getElementById('main-btn').innerText === 'ЗАЙТИ';

    if (!user || !pass) return alert("Введи дані!");

    const userRef = ref(db, 'users/' + user);

    if (isLoginMode) {
        // ЛОГІКА ВХОДУ (Читання з хмари)
        const snapshot = await get(userRef);
        if (snapshot.exists() && snapshot.val().password === pass) {
            sessionStorage.setItem('isLoggedIn', 'true');
            sessionStorage.setItem('username', user); // ДОДАЙ ЦЕЙ РЯДОК
            window.location.href = MAIN_SITE_URL;
        } else {
            alert("Невірний нік або пароль!");
        }
    } else {
        // ЛОГІКА РЕЄСТРАЦІЇ (Запис у хмару)
        const snapshot = await get(userRef);
        if (snapshot.exists()) {
            alert("Цей нік уже зайнятий!");
        } else {
            await set(userRef, { password: pass });
            alert("Акаунт створено в базі!");
            location.reload(); // Перезавантаження для входу
        }
    }
  };
</script>
</body>
