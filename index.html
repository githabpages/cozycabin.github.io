<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cozy Cabin Lab</title>
    <link rel="icon" href="screenshots/icon1.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body {
            background-image: url("screenshots/background.png");
            background-color: #121212;
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            image-rendering: pixelated; /* Щоб пікселі були чіткими */
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .main-container {
            text-align: center;
            transform: translateY(-5vh); 
            z-index: 2;
        }

        p.header-text, p.footer-text {
            color: #b3b3b3;
            font-family: "Minecraft 1.1", sans-serif;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
        }

        p.header-text { font-size: 20px; margin-bottom: 30px; }
        p.footer-text { font-size: 18px; margin-top: 30px; }

        .btn-link {
            display: inline-block;
            transition: transform 0.2s ease;
        }

        .btn-link:hover { transform: scale(1.1); }

        .img-button {
            border: none;
            background: none;
            padding: 0;
            cursor: pointer;
        }

        .social-links {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .social-item {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;
            background-color: rgba(255, 255, 255, 0.1);
            color: white;
            text-decoration: none;
            font-size: 24px;
            border-radius: 12px;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .social-item:hover { transform: translateY(-5px); }
        .discord:hover { background-color: #5865F2; }
        .youtube:hover { background-color: #FF0000; }
        .telegram:hover { background-color: #0088cc; }

        .install-info-btn {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            text-decoration: underline;
            cursor: pointer;
            font-size: 14px;
            margin-top: 10px;
            transition: 0.3s;
        }

        .install-info-btn:hover { color: white; }

        .guide-box {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -45%); /* Початкова позиція трохи нижче */
    background: rgba(0, 0, 0, 0.375);
    backdrop-filter: blur(15px);
    padding: 30px;
    border-radius: 20px;
    border: 1px solid rgba(163, 44, 142, 0.3);
    z-index: 1000;
    width: 300px;
    color: white;
    text-align: left;

    /* Стан "Сховано" */
    opacity: 0;
    pointer-events: none; 
    transition: all 0.4s ease; /* Це зробить зникнення теж плавним */
}

/* Стан "Показано" */
.guide-box.show {
    opacity: 1;
    pointer-events: auto; /* Дозволяємо натискати кнопки всередині */
    transform: translate(-50%, -50%); /* Повертаємо в центр */
}

        .guide-content h4 { color: #a32c8e; margin-top: 0; }
        .guide-content ul { list-style: none; padding: 0; }
        .guide-content li { margin: 10px 0; font-size: 14px; }
        .guide-content span { color: #a32c8e; margin-right: 10px; font-weight: bold; }

        .close-btn {
            margin-top: 15px;
            width: 100%;
            padding: 10px;
            background: #a32c8e;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }

@keyframes fadeInUp {
    from {
        opacity: 0;
        transform: translate(-50%, -45%); /* Починаємо трохи нижче */
    }
    to {
        opacity: 1;
        transform: translate(-50%, -50%); /* Повертаємо в центр */
    }
}

/* Клас, який ми будемо додавати при відкритті */
.guide-box.show {
    display: block !important;
    animation: fadeInUp 0.4s ease-out forwards;
}

.mini-gallery {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-top: 25px;
    margin-bottom: 10px;
}

.gallery-item {
    width: 120px; /* Розмір картинок */
    height: 70px;
    object-fit: cover; /* Щоб картинка не розтягувалась */
    border-radius: 12px;
    border: 2px solid rgba(255, 255, 255, 0.1);
    cursor: pointer;
    transition: all 0.3s ease;
    backdrop-filter: blur(5px);
}

.gallery-item:hover {
    transform: scale(1.2) translateY(-10px); /* Збільшення та підйом */
    border-color: rgba(163, 44, 142, 0.8); /* Фіолетова рамка при наведенні */
    box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
    z-index: 5;
}

.lightbox {
    display: none; /* Спочатку сховано */
    position: fixed;
    z-index: 2000; /* Поверх усього, навіть інструкції */
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.9);
    backdrop-filter: blur(10px);
    justify-content: center;
    align-items: center;
    cursor: zoom-out;
    opacity: 0;
    transition: opacity 0.3s ease;
}

/* Коли додаємо клас .active, показуємо лайтбокс */
.lightbox.active {
    display: flex;
    opacity: 1;
}

.lightbox {
    position: fixed;
    z-index: 2000;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.9);
    backdrop-filter: blur(10px);
    display: flex; /* Завжди флекс */
    justify-content: center;
    align-items: center;
    cursor: zoom-out;
    
    /* Початковий стан — невидимий */
    opacity: 0;
    pointer-events: none; 
    transition: opacity 0.3s ease;
}

/* Стан при відкритті */
.lightbox.active {
    opacity: 1;
    pointer-events: auto; /* Дозволяємо кліки */
}

.lightbox img {
    max-width: 90%;
    max-height: 80%;
    border-radius: 15px;
    box-shadow: 0 0 30px rgba(163, 44, 142, 0.5);
    border: 2px solid rgba(255, 255, 255, 0.1);
    transform: scale(0.8); /* Трохи менша при старті */
    transition: transform 0.3s ease;
}

.lightbox.active img {
    transform: scale(1); /* Збільшується до нормального розміру */
}

.map-container {
    position: relative;
    width: 600px; /* Налаштуй під свої мапи */
    height: 400px;
    margin: 20px auto;
    border: 2px solid rgba(163, 44, 142, 0.5);
    border-radius: 20px;
    overflow: hidden;
    background: rgba(0, 0, 0, 0.5);
}

.map-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease, transform 0.5s ease;
    transform: scale(1.1); /* Ефект наближення при переході */
}

.map-layer.active {
    opacity: 1;
    pointer-events: auto;
    transform: scale(1);
}

.map-base {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* Кнопки регіонів на головній мапі */
.region-btn {
    position: absolute;
    padding: 8px 15px;
    background: rgba(163, 44, 142, 0.8);
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-family: "Minecraft 1.1", sans-serif;
    font-size: 12px;
    transition: 0.3s;
}

.region-btn:hover {
    background: #a32c8e;
    transform: scale(1.1);
    box-shadow: 0 0 15px rgba(163, 44, 142, 0.8);
}

/* Позиції кнопок (приклади, налаштуй під свій малюнок) */
.region-1 { top: 30%; left: 25%; }
.region-2 { top: 60%; left: 70%; }

.back-btn {
    position: absolute;
    top: 10px;
    left: 10px;
    background: rgba(0, 0, 0, 0.7);
    color: white;
    border: 1px solid white;
    padding: 5px 10px;
    border-radius: 5px;
    cursor: pointer;
}

/* Спільний стиль для невидимих зон */
.map-hitbox {
    position: absolute;
    cursor: pointer;
    background: rgba(255, 255, 255, 0); /* Повністю прозорі */
    border-radius: 50%; /* Для круглих островів */
    transition: background 0.3s ease;
}

/* Дебаг-режим: якщо хочеш побачити, де кнопка, зміни 0 на 0.2 */
.map-hitbox:hover {
    background: rgba(163, 44, 142, 0.2); /* Легке підсвічування при наведенні */
}

/* ТОЧНІ КООРДИНАТИ (підбираємо під твою картинку) */
.init-zone {
    width: 7.5%;   /* Ширина зони */
    height: 16%;  /* Висота зони */
    top: 42%;     /* Позиція зверху */
    left: 46%;    /* Позиція зліва */
}

.verta-zone {
    width: 15%;
    height: 20%;
    top: 39%;
    left: 53%;
}

@keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

.glitch-wrapper {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.98);
    display: none; /* Сховано */
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    cursor: crosshair;
}

.glitch-text {
    color: #fff;
    font-size: 4rem;
    font-family: "Minecraft 1.1", sans-serif;
    position: relative;
    animation: glitch-skew 1s infinite linear alternate-reverse;
}

.glitch-text::before, .glitch-text::after {
    content: attr(data-text);
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    opacity: 0.8;
}

.glitch-text::before {
    color: #0ff;
    animation: glitch-anim 0.2s infinite linear alternate-reverse;
    left: 2px;
}

.glitch-text::after {
    color: #f0f;
    animation: glitch-anim2 0.3s infinite linear alternate-reverse;
    left: -2px;
}

.glitch-subtext {
    color: #555;
    font-family: monospace;
    margin-top: 20px;
}

@keyframes glitch-anim {
    0% { clip: rect(10px, 9999px, 40px, 0); transform: skew(0.5deg); }
    100% { clip: rect(80px, 9999px, 90px, 0); transform: skew(0.8deg); }
}

@keyframes glitch-anim2 {
    0% { clip: rect(50px, 9999px, 60px, 0); transform: skew(-0.5deg); }
    100% { clip: rect(20px, 9999px, 30px, 0); transform: skew(-0.8deg); }
}

@keyframes glitch-skew {
    0% { transform: skew(0deg); }
    10% { transform: skew(5deg); }
    20% { transform: skew(-5deg); }
    100% { transform: skew(0deg); }
}

    </style>
</head>
<body>

<div class="main-container">
    <p class="header-text">
        Вітаємо на офіційному порталі Cozy Cabin!<br/>
        Для завантаження актуальної версії модпаку і ресурсів.
    </p>

    <a href="Foldmods/Mod1.zip" class="btn-link">
        <button class="img-button">
            <img src="screenshots/button.png" alt="Завантажити" width="200">
        </button>
    </a>
    
    <br/>
    <button class="install-info-btn" onclick="toggleInstall()">Як встановити?</button><br/>

    <p class="footer-text">Дякуємо, що ви з нами!</p>

    <div class="social-links">
        <a href="https://discord.gg/P36aJ6SHSy" class="social-item discord"><i class="fab fa-discord"></i></a>
        <a href="https://www.youtube.com/@CozyCabin_Lab" class="social-item youtube"><i class="fab fa-youtube"></i></a>
        <a href="https://t.me/+Wlt7EVvoL1kzYjli" class="social-item telegram"><i class="fab fa-telegram-plane"></i></a>
    </div>
</div>

<div class="mini-gallery">
    <img src="screenshots/screen1.png" alt="screen1.png" class="gallery-item" onclick="expandImg(this)">
    <img src="screenshots/screen2.png" alt="screen2.png" class="gallery-item" onclick="expandImg(this)">
    <img src="screenshots/screen3.png" alt="screen3.png" class="gallery-item" onclick="expandImg(this)">
</div>

<div id="install-guide" class="guide-box">
    <div class="guide-content">
        <h4>Кроки встановлення:</h4>
        <ul>
            <li><span>1.</span> Завантаж архів <b>Modpack.zip</b></li>
            <li><span>2.</span> Встанови <b>Forge 1.20.1</b></li>
            <li><span>3.</span> Перенеси вміст у <b>.minecraft/mods</b></li>
        </ul>
        <button class="close-btn" onclick="toggleInstall()">Зрозуміло!</button>
    </div>
</div>

<div id="lightbox" class="lightbox" onclick="closeLightbox()">
    <img id="lightbox-img" src="" alt="Full Screen">
</div>

<div class="map-section">
    <div class="map-container">
        <div id="universe-map" class="map-layer active">
            <img src="screenshots/CoCa_verse.png" alt="Cozy Cabin Multiverse" class="map-base">
            
            <div class="map-hitbox init-zone" onclick="showGlitch()" title="???"></div>
            <div class="map-hitbox verta-zone" onclick="openMapNewTab('screenshots/verta_detail.jpg')" title="Відкрити мапу Верта у новій вкладці"></div>
        </div>
    </div>
</div>

<div id="glitch-overlay" class="glitch-wrapper" onclick="closeGlitch()">
    <div class="glitch-text" data-text="SYSTEM CORRUPTION">NO DATA</div>
    <p class="glitch-subtext">ERROR: DATA_NOT_FOUND [INIT_SECTOR]</p>
</div>

<script src="https://unpkg.com/magic-snowflakes/dist/snowflakes.min.js"></script>
<script>
    // Ініціалізація сніжинок
    var snowflakes = new Snowflakes({
        color: '#ffffff',
        count: 50,
        minOpacity: 0.2,
        maxOpacity: 0.6
    });

    // Функція відкриття інструкції (ОБОВ'ЯЗКОВО В ТЕГУ SCRIPT)
    function toggleInstall() {
    var guide = document.getElementById("install-guide");
    // Просто перемикаємо клас
    guide.classList.toggle("show");
}

function expandImg(img) {
    var lightbox = document.getElementById("lightbox");
    var lightboxImg = document.getElementById("lightbox-img");
    
    lightboxImg.src = img.src; // Беремо адресу картинки, на яку натиснули
    lightbox.classList.add("active"); // Показуємо плашку
}

function expandImg(img) {
    var lightbox = document.getElementById("lightbox");
    var lightboxImg = document.getElementById("lightbox-img");
    
    lightboxImg.src = img.src;
    lightbox.classList.add("active");
}

function closeLightbox() {
    var lightbox = document.getElementById("lightbox");
    lightbox.classList.remove("active");
}

function showWorld(worldId) {
    document.querySelectorAll('.map-layer').forEach(l => l.classList.remove('active'));
    document.getElementById(worldId).classList.add('active');
}

function showUniverse() {
    document.querySelectorAll('.map-layer').forEach(l => l.classList.remove('active'));
    document.getElementById('universe-map').classList.add('active');
}

function openMapNewTab(imgSrc) {
    // Відкриває картинку в новій вкладці
    window.open(imgSrc, '_blank');
}

function expandMap(imgSrc) {
    var lightbox = document.getElementById("lightbox");
    var lightboxImg = document.getElementById("lightbox-img");
    
    lightboxImg.src = imgSrc; // Встановлюємо шлях до детальної мапи
    lightbox.classList.add("active"); // Відкриваємо лайтбокс
}

function showGlitch() {
    const overlay = document.getElementById('glitch-overlay');
    overlay.style.display = 'flex';
}

function closeGlitch() {
    const overlay = document.getElementById('glitch-overlay');
    overlay.style.display = 'none';
}
</script>

</body>
</html>
